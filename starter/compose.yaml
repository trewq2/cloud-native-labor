services:
  # Codespaces / Docker-in-Docker környezetben a két konténer közötti
  # bridge routing problémás lehet. A web ezért a redis szolgáltatás
  # hálózati névterét használja, és localhoston éri el a Redist.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # A web ugyanebben a hálózati névtérben figyel a 8080-as porton.
      - "8080:8080"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    restart: unless-stopped

  web:
    build: .
    network_mode: "service:redis"
    environment:
      APP_VERSION: "compose-1.0"
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
